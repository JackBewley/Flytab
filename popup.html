<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flytab</title>
    <link rel="icon" type="image/png" href="icons/icon-32.png">
    <script src="early-input.js"></script>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <h1><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="1.25"/>  <polyline points="8,4 9.5,8 22,8"/>  <line x1="15" y1="4" x2="16.5" y2="8"/>  <line x1="16.5" y1="14" x2="7.5" y2="14"/>  <polyline points="11,10.5 7.5,14 11,17.5"/></svg>Flytab</h1>
      <span id="position" aria-hidden="true">Recent tabs</span>
    </header>
    <main>
      <div id="tabs" role="listbox" aria-label="Recent tabs" aria-describedby="hint" tabindex="0" aria-busy="true"></div>
      <p id="empty" hidden>Visit another tab to start switching.</p>
      <p id="error" role="alert" hidden></p>
    </main>
    <footer>
      <p id="hint">Loading recent tabs…</p>
      <p class="keys"><span><kbd>Enter</kbd> switch</span><span><kbd>Esc</kbd> cancel</span><button id="cancel" type="button">Cancel</button></p>
    </footer>
  </body>
</html>
