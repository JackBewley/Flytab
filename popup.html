<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="early-input.js"></script>
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flytab</title>
    <link rel="icon" type="image/png" href="icons/icon-32.png">
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <div id="tabs" role="listbox" aria-label="Recent tabs" aria-describedby="hint" tabindex="0" aria-busy="true"></div>
      <p id="empty" hidden>Visit another tab to start switching.</p>
      <p id="error" role="alert" hidden></p>
    </main>
    <p id="hint" class="sr-only">F next. Release modifiers to switch. Enter selects. Escape cancels.</p>
  </body>
</html>
